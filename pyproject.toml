[project]
name = "gridtemper"
version = "0.1.0"
description = "TX-2030 synthetic-grid case refinement pipeline (dispatch, conductor sizing, DC/AC power flow, reactive placement) — Python conversion of the TX-2030-Case-Updates MATLAB codebase"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jonathan Snodgrass", email = "snodgrass@tamu.edu" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",     # sparse matrices, splu, io.loadmat (data conversion + test fixtures)
    "pandas>=2.2",
    "pyarrow>=15.0",   # parquet data store
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]   # primary UCED backend (D2); fallback is dependency-free
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]
pandapower = ["pandapower>=2.14"]           # AC backend option
powerworld = ["pywin32>=306"]   # AC backend via SimAuto COM (Windows + a PowerWorld install)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridtemper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # scipy.io.loadmat returns legacy spmatrix; the migration warning is noise here.
    "ignore:the matrix subclass is not the recommended way:PendingDeprecationWarning",
    "ignore:The default value for `spmatrix` is changing:DeprecationWarning",
]
